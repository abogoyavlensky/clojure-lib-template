name: Checks

on:
  push:
    branches: [ master ]
    tags:
      - "*"
  pull_request:
    branches: [ master ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cache-clojure-deps
      - uses: jdx/mise-action@v2
      - name: Run tests
        run: |
          rite new
          mise trust && mise install
          cd tmplframe && bb check
